services:
  redis:
    image: redis:8.10.2
    ports:
      - 6379:6379
    networks:
      - back-tier
  db:
    image: postgres:15-alpine
    networks:
      - back-tier
    volumes:
      - db_data_zad2:/var/lib/postgresql/data
    env_file: .env
  result:
    build: ./result
    networks:
      - front-tier
      - back-tier
    ports:
      # 5050 instead 5000 because on Mac AirPlay use port 5000
      - 5050:80
      - 5858:5858
    depends_on:
      - db
    volumes:
      - ./result:/app
  vote:
    build: ./vote
    ports:
      - 5001:80
    networks:
      - front-tier
      - back-tier
    depends_on:
      - redis
    volumes:
      - ./vote:/app
  worker:
    build: ./worker
    networks:
      - back-tier
    depends_on:
      - redis
      - db
    platform: linux/amd64
    restart: on-failure

networks:
  front-tier:
  back-tier:

volumes:
  db_data_zad2:
